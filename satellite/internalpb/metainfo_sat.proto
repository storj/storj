syntax = "proto3";
option go_package = "storj.io/storj/satellite/internalpb";

package satellite.metainfo;

import "encryption.proto";
import "pico.proto";
import "google/protobuf/timestamp.proto";
import "metainfo.proto";
import "pointerdb.proto";

message StreamID {
    reserved 14;
    bytes  bucket = 1;
    bytes  encrypted_object_key = 2;
    int64  version = 3;

    encryption.EncryptionParameters encryption_parameters = 12;

    google.protobuf.Timestamp creation_date = 5  [(pico.field).custom_type = "time.Time", (pico.field).custom_serialize = "storj.io/picobuf/picoconv.Timestamp", (pico.field).always_present = true];
    google.protobuf.Timestamp expiration_date = 6  [(pico.field).custom_type = "time.Time", (pico.field).custom_serialize = "storj.io/picobuf/picoconv.Timestamp", (pico.field).always_present = true];

    bool multipart_object = 11;

    bytes satellite_signature = 9;

    bytes stream_id = 10;

    int32 placement = 13;

    bool versioned = 15;

    .metainfo.Retention retention = 16;
    bool legal_hold = 17;

    // checksum is set when the object has checksum properties. Uplink decodes it from upload
    // IDs, so its field numbers must not change.
    StreamIDChecksum checksum = 18;
}

message StreamIDChecksum {
    .metainfo.ObjectChecksumAlgorithm algorithm    = 1;
    bool                              is_composite = 2;
    bool                              is_default   = 3;
}

message SegmentID {
    StreamID stream_id = 1;
    int32    part_number = 2;
    int32    index = 3;

    bytes root_piece_id = 5 [(pico.field).custom_type = "storj.io/common/storj.PieceID", (pico.field).always_present = true];
    repeated .metainfo.AddressedOrderLimit original_order_limits = 6;
    google.protobuf.Timestamp creation_date = 7  [(pico.field).custom_type = "time.Time", (pico.field).custom_serialize = "storj.io/picobuf/picoconv.Timestamp", (pico.field).always_present = true];
    pointerdb.RedundancyScheme redundancy_scheme = 9;

    bytes satellite_signature = 8;
}
