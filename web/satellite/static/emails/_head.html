{{ define "head" }}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="en">
 <head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta content="telephone=no" name="format-detection">
  {{/* Exposes the branding color for tests; not every email renders an element that uses it. */}}
  <meta content="{{.PrimaryColor}}" name="primary-color">
  <style type="text/css">
#outlook a { padding: 0; }
span.MsoHyperlink, span.MsoHyperlinkFollowed { color: inherit; mso-style-priority: 99; }
a.email-button { mso-style-priority: 100!important; text-decoration: none!important; }
a[x-apple-data-detectors], #MessageViewBody a {
  color: inherit!important;
  text-decoration: none!important;
  font-size: inherit!important;
  font-family: inherit!important;
  font-weight: inherit!important;
  line-height: inherit!important;
}
u + .email-body img ~ div div { display: none; }
/* Typography stays inline and identical at every width; only layout adapts. */
@media only screen and (max-width: 600px) {
  .mobile-no-right { padding-right: 0!important; }
  .mobile-no-left { padding-left: 0!important; }
  .mobile-center, .mobile-center h2 { text-align: center!important; }
  .divider-table { display: inline-table; }
  a.email-button {
    padding: 15px 30px!important;
    display: inline-block!important;
  }
  .button-border,
  .social-links, .social-links td { display: inline-block!important; }
  .email-content table, .email-header table, .email-footer table,
  .email-content, .email-header, .email-footer {
    width: 100%!important;
    max-width: 600px!important;
  }
  .email-logo { width: 140px!important; height: auto!important; }
  table.fixed-table { width: auto!important; }
}
</style>
{{ end }}
