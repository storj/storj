{{ define "header" }}
<div dir="ltr" class="email-background" lang="en" style="background-color:#FAFAFA">
<table width="100%" cellspacing="0" cellpadding="0" class="email-wrapper" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-collapse:collapse;border-spacing:0px;padding:0;Margin:0;width:100%;height:100%;background-color:#FAFAFA">
  <tr>
    <td valign="top" style="padding:0;Margin:0">
      <table width="600" cellspacing="0" cellpadding="0" align="center" class="email-header" role="presentation" style="{{ template "style-table" }};width:600px">
        <tr>
          <td align="center" style="padding:25px 20px 30px;Margin:0;font-size:0">
            <a target="_blank" href="{{ .HomepageURL }}" style="mso-line-height-rule:exactly;text-decoration:underline;color:#666666;font-size:14px"><img src="{{ .LogoURL }}" alt="{{ .BrandName }} Logo" width="140" title="{{ .BrandName }} Logo" class="email-logo" style="display:block;font-size:12px;border:0;outline:none;text-decoration:none;width:140px;max-height:140px"></a>
          </td>
        </tr>
      </table>
{{ end }}
