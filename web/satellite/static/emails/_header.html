{{ define "header" }}
<div dir="ltr" class="email-background" lang="en" style="background-color:#FAFAFA"><!--[if gte mso 9]>
<v:background xmlns:v="urn:schemas-microsoft-com:vml" fill="t">
<v:fill type="tile" color="#fafafa"></v:fill>
</v:background>
<![endif]-->
<table width="100%" cellspacing="0" cellpadding="0" class="email-wrapper" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-collapse:collapse;border-spacing:0px;padding:0;Margin:0;width:100%;height:100%;background-repeat:repeat;background-position:center top;background-color:#FAFAFA">
  <tr>
    <td valign="top" style="padding:0;Margin:0">
      <table cellspacing="0" cellpadding="0" align="center" class="email-header" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-collapse:collapse;border-spacing:0px;width:100%;table-layout:fixed !important;background-color:transparent;background-repeat:repeat;background-position:center top">
        <tr>
          <td align="center" style="padding:0;Margin:0">
            <table align="center" cellpadding="0" cellspacing="0" bgcolor="#ffffff" class="email-header-body" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-collapse:collapse;border-spacing:0px;background-color:transparent;width:600px">
              <tr>
                <td align="left" style="padding:20px;Margin:0">
                  <table cellpadding="0" cellspacing="0" width="100%" role="none" style="{{ template "style-table" }}">
                    <tr>
                      <td align="center" valign="top" class="mobile-no-right" style="padding:0;Margin:0;width:560px">
                        <table cellpadding="0" cellspacing="0" width="100%" role="presentation" style="{{ template "style-table" }}">
                          <tr>
                            <td align="center" style="padding:0;Margin:0;padding-top:5px;padding-bottom:10px;font-size:0px">
                              <a target="_blank" href="{{ .HomepageURL }}" style="mso-line-height-rule:exactly;text-decoration:underline;color:#666666;font-size:14px"><img src="{{ .LogoURL }}" alt="{{ .BrandName }} Logo" width="140" title="{{ .BrandName }} Logo" class="email-logo" style="display:block;font-size:12px;border:0;outline:none;text-decoration:none;width:140px !important; max-height: 140px !important;"></a>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
      {{ end }}
